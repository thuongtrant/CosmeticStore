name: cosmetic-store

services:
  mysql:
    image: mysql:8.0
    container_name: cosmetic-db
    env_file:
      - ./database-service.env
    ports:
      - 3307:3306
    volumes:
      - mysql_data:/var/lib/mysql
      # - ./cosmetic-store-be/s-data/bfystore.sql.gz:/docker-entrypoint-initdb.d/bfystore.sql.gz

    networks:
      - cosmetic-network
    command: >
      sh -c "
      curl -L \"$${MYSQL_DUMP_FILE_URL}\" -o /docker-entrypoint-initdb.d/bfystore.sql.gz &&
      /entrypoint.sh mysqld
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: ./cosmetic-store-be
    container_name: cosmetic-backend
    env_file:
      - ./backend-service.env
    ports:
      - "8080:8080"
    networks:
      - cosmetic-network
    depends_on:
      - mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -s -o /dev/null -w '%{http_code}' $${SERVICE_HEALTH_CHECK_URL} | grep -q '^200$'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./cosmetic-store-fe
    container_name: cosmetic-frontend
    ports:
      - 3000:80
    networks:
      - cosmetic-network
    depends_on:
      - backend
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    container_name: cosmetic-nginx
    depends_on: [frontend, backend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - cosmetic-network


volumes:
  mysql_data:

networks:
  cosmetic-network:
    driver: bridge
