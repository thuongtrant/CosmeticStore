name: cosmetic-store

services:
  mysql:
    image: mysql:8.0
    env_file:
      - ./database-service.env
    ports:
      - 3307:3306
    volumes:
      - mysql_data:/var/lib/mysql
      # - ./cosmetic-store-be/s-data/bfystore.sql.gz:/docker-entrypoint-initdb.d/bfystore.sql.gz

    networks:
      - cosmetic-network
    command: >
      sh -c "
      curl -L \"$${MYSQL_DUMP_FILE_URL}\" -o /docker-entrypoint-initdb.d/bfystore.sql.gz &&
      /entrypoint.sh mysqld
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: ./cosmetic-store-be
    env_file:
      - ./backend-service.env
    ports:
      - 8080
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        max_attempts: 3
        window: 20s
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - cosmetic-network
    depends_on:
      - mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -s -o /dev/null -w '%{http_code}' $${SERVICE_HEALTH_CHECK_URL} | grep -q '^200$'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./cosmetic-store-fe
    ports:
      - 80
    networks:
      - cosmetic-network
    depends_on:
      - backend
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    depends_on: [frontend, backend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - cosmetic-network


volumes:
  mysql_data:

networks:
  cosmetic-network:
    driver: bridge
