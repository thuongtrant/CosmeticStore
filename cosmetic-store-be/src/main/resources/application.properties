spring.application.name=CosmeticStore
server.port=${SERVICE_PORT:8080}
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
logging.level.org.springframework.web.multipart=DEBUG
logging.level.org.apache.catalina=DEBUG

# Temporarily change to update mode to create missing tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration - Updated with strong 512-bit key
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION}

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=1800
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true

# Remember-me Configuration
spring.security.remember-me.key=mySecretKey
spring.security.remember-me.validity=604800

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
# MoMo Configuration
momo.partner-code=${MOMO_PARTNER_CODE}
momo.access-key=${MOMO_ACCESS_KEY}
momo.secret-key=${MOMO_SECRET_KEY}
momo.endpoint=${MOMO_ENDPOINT}
momo.return-url=${MOMO_RETURN_URL}
momo.notify-url=${MOMO_NOTIFY_URL}

# Firebase Configuration
firebase.api-key=${FIREBASE_API_KEY}
firebase.auth-domain=${FIREBASE_AUTH_DOMAIN}
firebase.project-id=${FIREBASE_PROJECT_ID}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET}
firebase.messaging-sender-id=${FIREBASE_MESSAGING_SENDER_ID}
firebase.app-id=${FIREBASE_APP_ID}
firebase.measurement-id=${FIREBASE_MEASUREMENT_ID}

# Chat Configuration
chat.max-message-length=500
chat.max-rooms-per-admin=50
chat.auto-close-inactive-days=30

# OpenAI Assistant Configuration
openai.api.key=${OPENAI_API_KEY}
openai.assistant.id=${OPENAI_ASSISTANT_ID}
openai.assistant.enabled=true
openai.assistant.timeout-seconds=30
openai.assistant.model=gpt-4o-mini
openai.assistant.max-tokens=1000
openai.assistant.temperature=0.7

# OAuth2 Configuration for Google and Facebook
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.registration.facebook.redirect-uri=${FACEBOOK_REDIRECT_URI}
spring.security.oauth2.client.registration.facebook.client-name=Facebook


# OAuth2 Provider Configuration
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v18.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v18.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/v18.0/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.user-name-attribute=id
spring.security.oauth2.client.provider.facebook.jwk-set-uri=

