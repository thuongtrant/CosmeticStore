<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{base :: layout(~{::title}, ~{::main})}">
<head>
    <title>Quản lý danh mục - BeautyForYou Admin</title>
</head>
<body>
<main>
    <div class="main-content">
        <div class="container-fluid mt-4">
            <div class="row">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="page-title"><i class="fas fa-list me-2"></i>Quản lý danh mục</h2>
                        <div>
                            <a href="/admin/categories/new" class="btn btn-pink me-2">
                                <i class="fas fa-plus me-1"></i>Thêm danh mục mới
                            </a>
                            <a href="/dashboard" class="btn btn-outline-pink">
                                <i class="fas fa-arrow-left me-1"></i>Quay lại Dashboard
                            </a>
                        </div>
                    </div>

                    <div class="management-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0"><i class="fas fa-list me-2"></i>Danh sách danh mục</h5>
                        </div>
                        <div class="row">
                            <div th:each="cate : ${categories}" class="col-md-4 mb-3">
                                <div class="card h-100" style="border-radius: 15px; border: 1px solid rgba(224, 183, 179, 0.2); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);">
                                    <div class="card-body">
                                        <h5 class="card-title" th:text="${cate.name}">Tên danh mục</h5>
                                        <p class="card-text">
                                            <small class="text-muted">
                                                ID: <span th:text="${cate.id}">1</span>
                                            </small>
                                        </p>
                                        <div class="d-flex gap-2">
                                            <a th:href="@{/admin/categories/{id}/edit(id=${cate.id})}"
                                               class="btn btn-outline-pink btn-sm">
                                                <i class="fas fa-edit me-1"></i>Sửa
                                            </a>
                                            <a th:href="@{/admin/categories/{id}/delete(id=${cate.id})}"
                                               class="btn btn-danger btn-sm"
                                               onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này?')">
                                                <i class="fas fa-trash me-1"></i>Xóa
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div th:if="${#lists.isEmpty(categories)}" class="text-center py-5">
                            <i class="fas fa-folder-open fa-3x text-muted mb-3"></i>
                            <h5 class="text-muted">Chưa có danh mục nào</h5>
                            <p class="text-muted">Hãy thêm danh mục đầu tiên để bắt đầu quản lý sản phẩm</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
