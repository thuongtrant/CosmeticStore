<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - BeautyForYou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="login-container">
                <div class="login-form">
                    <div class="login-header">
                        <a href="/" class="brand-logo">
                           BeautyForYou
                        </a>
                        <h4 class="text-center mb-0">Đăng nhập</h4>
                    </div>

<!--                    &lt;!&ndash; Hiển thị thông báo lỗi &ndash;&gt;-->
<!--                    <div th:if="${param.error}" class="alert alert-danger">-->
<!--                        <i class="fas fa-exclamation-triangle me-2"></i>-->
<!--                        Tên đăng nhập hoặc mật khẩu không đúng!-->
<!--                    </div>-->

<!--                    &lt;!&ndash; Hiển thị thông báo logout &ndash;&gt;-->
<!--                    <div th:if="${param.logout}" class="alert alert-success">-->
<!--                        <i class="fas fa-check-circle me-2"></i>-->
<!--                        Bạn đã đăng xuất thành công!-->
<!--                    </div>-->

<!--                    &lt;!&ndash; Hiển thị thông báo đăng ký thành công &ndash;&gt;-->
<!--                    <div th:if="${param.registerSuccess}" class="alert alert-success">-->
<!--                        <i class="fas fa-check-circle me-2"></i>-->
<!--                        Đăng ký thành công! Vui lòng đăng nhập.-->
<!--                    </div>-->
                    <!-- Success Messages -->
                    <div th:if="${successMessage}" class="alert alert-success">
                        <i class="fas fa-check-circle me-2"></i>
                        <span th:text="${successMessage}"></span>
                    </div>

<!--                    &lt;!&ndash; Warning Messages &ndash;&gt;-->
<!--                    <div th:if="${warningMessage}" class="alert alert-warning">-->
<!--                        <i class="fas fa-exclamation-triangle me-2"></i>-->
<!--                        <span th:text="${warningMessage}"></span>-->
<!--                    </div>-->

                    <!-- Error Messages -->
                    <div th:if="${errorMessage}" class="alert alert-danger">
                        <i class="fas fa-times-circle me-2"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <!-- Customer Message -->
                    <div th:if="${customerMessage}" class="alert alert-info">
                        <i class="fas fa-info-circle me-2"></i>
                        <strong>Thông báo:</strong><br>
                        <span th:text="${customerMessage}"></span>
                    </div>

                    <div th:if="${accessDeniedMessage}" class="alert alert-danger">
                        <i class="fas fa-shield-alt me-2"></i>
                        <strong>Truy cập bị từ chối:</strong><br>
                        <span th:text="${accessDeniedMessage}"></span>
                    </div>
                    <form th:action="@{/perform_login}" th:object="${loginRequest}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                <i class="fas fa-user me-1"></i>Tên đăng nhập
                            </label>
                            <input type="text"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                                   id="username"
                                   th:field="*{username}"
                                   placeholder="Nhập tên đăng nhập"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                                 th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock me-1"></i>Mật khẩu
                            </label>
                            <input type="password"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                   id="password"
                                   th:field="*{password}"
                                   placeholder="Nhập mật khẩu"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                            <label class="form-check-label" for="remember-me">
                                Ghi nhớ đăng nhập
                            </label>
                        </div>

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <button type="submit" class="btn btn-pink mb-3">
                            <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="mb-2">
                            <a href="/register" class="text-decoration-none">
                                <i class="fas fa-user-plus me-1"></i>Tạo tài khoản mới
                            </a>
                        </p>
                        <p class="mb-0">
                            <a href="/forgot-password" class="text-decoration-none">
                                <i class="fas fa-key me-1"></i>Quên mật khẩu?
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
    body {
        background: linear-gradient(135deg, #F5E6E4 0%, #FFFFFF 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #5D4E75;
    }

    .login-container {
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(224, 183, 179, 0.15);
        overflow: hidden;
        border-top: 4px solid #E0B7B3;
    }

    .login-form {
        padding: 2.5rem;
    }

    .login-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .brand-logo {
        color: #E0B7B3;
        font-size: 1.8rem;
        font-weight: 700;
        text-decoration: none;
        margin-bottom: 0.5rem;
        display: block;
    }

    .brand-logo:hover {
        color: #D4A4A0;
    }

    h4 {
        color: #5D4E75;
        font-weight: 600;
    }

    .btn-pink {
        background: linear-gradient(135deg, #E0B7B3, #D4A4A0);
        border: none;
        color: white;
        border-radius: 20px;
        padding: 12px 30px;
        font-weight: 600;
        width: 100%;
    }

    .btn-pink:hover {
        background: linear-gradient(135deg, #D4A4A0, #E0B7B3);
        color: white;
        transform: translateY(-1px);
    }

    .form-control {
        border-radius: 10px;
        border: 2px solid #e9ecef;
        padding: 10px 15px;
    }

    .form-control:focus {
        border-color: #E0B7B3;
        box-shadow: 0 0 0 0.2rem rgba(224, 183, 179, 0.25);
    }

    .form-label {
        color: #5D4E75;
        font-weight: 500;
        margin-bottom: 0.5rem;
    }

    .alert {
        border-radius: 10px;
        border-left: 4px solid;
        margin-bottom: 1.5rem;
    }

    .alert-danger {
        background: #fff5f5;
        border-left-color: #dc3545;
        color: #721c24;
    }

    .alert-success {
        background: #f0fff4;
        border-left-color: #28a745;
        color: #155724;
    }

    .text-decoration-none {
        color: #E0B7B3 !important;
    }

    .text-decoration-none:hover {
        color: #D4A4A0 !important;
    }

    .form-check-label {
        color: #5D4E75;
        font-size: 0.9rem;
    }

    .is-invalid {
        border-color: #dc3545;
    }

    .invalid-feedback {
        display: block;
        color: #dc3545;
        font-size: 0.875rem;
        margin-top: 0.25rem;
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
