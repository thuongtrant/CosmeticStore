<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::main})}">
<head>
    <title>Quản lý đơn hàng - Admin</title>
</head>
<body>
<main>
    <div class="container-fluid">
        <div class="main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2 page-title">Quản lý đơn hàng</h1>
            </div>

            <!-- Alerts -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Statistics Cards -->
            <div class="row mb-4" th:if="${orderStats}">
                <div class="col-xl-2 col-md-4 mb-4">
                    <div class="stats-card">
                        <div class="stats-icon">
                            <i class="fas fa-shopping-cart"></i>
                        </div>
                        <div class="stats-number" th:text="${orderStats.totalCount}">0</div>
                        <div class="stats-label">Tổng đơn hàng</div>
                    </div>
                </div>
                <div class="col-xl-2 col-md-4 mb-4">
                    <div class="stats-card">
                        <div class="stats-icon">
                            <i class="fas fa-calendar"></i>
                        </div>
                        <div class="stats-number" th:text="${orderStats.todayCount}">0</div>
                        <div class="stats-label">Hôm nay</div>
                    </div>
                </div>
                <div class="col-xl-2 col-md-4 mb-4">
                    <div class="stats-card">
                        <div class="stats-icon">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="stats-number" th:text="${orderStats.pendingCount}">0</div>
                        <div class="stats-label">Chờ xử lý</div>
                    </div>
                </div>
            </div>

            <!-- Filter and Search -->
            <div class="management-card mb-4">
                <h5 class="mb-3"><i class="fas fa-filter me-2"></i>Bộ lọc</h5>
                <form method="get" th:action="@{/admin/orders}">
                    <div class="row">
                        <div class="col-md-4">
                            <label for="status" class="form-label">Trạng thái đơn hàng:</label>
                            <select class="form-select" id="status" name="status">
                                <option value="">Tất cả trạng thái</option>
                                <option th:each="status : ${orderStatuses}"
                                        th:value="${status}"
                                        th:text="${status.name()}"
                                        th:selected="${status.name() == currentStatus}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="search" class="form-label">Tìm kiếm theo số đơn hàng:</label>
                            <input type="text" class="form-control" id="search" name="search"
                                   th:value="${currentSearch}" placeholder="Nhập số đơn hàng...">
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-pink me-2">
                                <i class="fas fa-search"></i> Tìm kiếm
                            </button>
                            <a th:href="@{/admin/orders}" class="btn btn-outline-pink">
                                <i class="fas fa-refresh"></i> Đặt lại
                            </a>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Orders Table -->
            <div class="management-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0"><i class="fas fa-list me-2"></i>Danh sách đơn hàng</h5>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                        <tr>
                            <th>Số đơn hàng</th>
                            <th>Khách hàng</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th>Ngày đặt</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="order : ${ordersPage.content}" th:if="${ordersPage.hasContent()}">
                            <td>
                                <a th:href="@{/admin/orders/{id}(id=${order.id})}"
                                   class="text-decoration-none fw-bold"
                                   th:text="${order.orderNumber}">
                                </a>
                            </td>
                            <td th:text="${order.shippingAddress}">Địa chỉ giao hàng</td>
                            <td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</td>
                            <td>
                                <span th:class="${'badge ' +
                                    (order.status == 'PENDING' ? 'bg-warning' :
                                     order.status == 'CONFIRMED' ? 'bg-info' :
                                     order.status == 'PROCESSING' ? 'bg-primary' :
                                     order.status == 'SHIPPED' ? 'bg-secondary' :
                                     order.status == 'DELIVERED' ? 'bg-success' :
                                     order.status == 'CANCELLED' ? 'bg-danger' : 'bg-light')}"
                                      th:text="${order.status}">
                                </span>
                            </td>
                            <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2024 10:00</td>
                            <td>
                                <a th:href="@{/admin/orders/{id}(id=${order.id})}"
                                   class="btn btn-sm btn-outline-pink">
                                    <i class="fas fa-eye"></i> Xem
                                </a>
                            </td>
                        </tr>
                        <tr th:unless="${ordersPage.hasContent()}">
                            <td colspan="6" class="text-center text-muted py-4">
                                <i class="fas fa-inbox fa-2x mb-2"></i>
                                <div>Không có đơn hàng nào</div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav th:if="${ordersPage.totalPages > 1}">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:class="${ordersPage.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/admin/orders(page=${ordersPage.number - 1}, status=${currentStatus}, search=${currentSearch})}">
                                Trước
                            </a>
                        </li>

                        <li th:each="i : ${#numbers.sequence(0, ordersPage.totalPages - 1)}"
                            class="page-item" th:class="${i == ordersPage.number} ? 'active'">
                            <a class="page-link"
                               th:href="@{/admin/orders(page=${i}, status=${currentStatus}, search=${currentSearch})}"
                               th:text="${i + 1}">1</a>
                        </li>

                        <li class="page-item" th:class="${ordersPage.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/admin/orders(page=${ordersPage.number + 1}, status=${currentStatus}, search=${currentSearch})}">
                                Sau
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</main>
</body>
</html>
