<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - BeautyForYou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #E0B7B3;
            --dark-pink: #D4A4A0;
            --light-pink: #F5E6E4;
            --text-dark: #5D4E75;
            --white: #FFFFFF;
        }

        body {
            background: linear-gradient(135deg, var(--light-pink) 0%, var(--white) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-dark);
        }

        .login-container {
            background: var(--white);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(224, 183, 179, 0.15);
            overflow: hidden;
            border-top: 4px solid var(--primary-pink);
        }

        .login-form {
            padding: 2.5rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-logo {
            color: var(--primary-pink);
            font-size: 1.8rem;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 0.5rem;
            display: block;
        }

        .brand-logo:hover {
            color: var(--dark-pink);
        }

        h4 {
            color: var(--text-dark);
            font-weight: 600;
        }

        .btn-pink {
            background: linear-gradient(135deg, var(--primary-pink), var(--dark-pink));
            border: none;
            color: var(--white);
            border-radius: 20px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-pink:hover {
            background: linear-gradient(135deg, var(--dark-pink), var(--primary-pink));
            color: var(--white);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(224, 183, 179, 0.3);
        }

        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 10px 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 0.2rem rgba(224, 183, 179, 0.25);
        }

        .form-label {
            color: var(--text-dark);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .alert {
            border-radius: 10px;
            border-left: 4px solid;
            margin-bottom: 1.5rem;
        }

        .alert-danger {
            background: #fff5f5;
            border-left-color: #dc3545;
            color: #721c24;
        }

        .alert-success {
            background: #f0fff4;
            border-left-color: #28a745;
            color: #155724;
        }

        .text-decoration-none {
            color: var(--primary-pink) !important;
            transition: color 0.3s ease;
        }

        .text-decoration-none:hover {
            color: var(--dark-pink) !important;
        }

        .form-check-label {
            color: var(--text-dark);
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .login-form {
                padding: 2rem;
            }
            .brand-logo {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="login-container">
                <div class="login-form">
                    <div class="login-header">
                        <a href="/" class="brand-logo">
                            <i class="fas fa-spa"></i> BeautyForYou
                        </a>
                        <h4 class="text-center mb-0">Đăng nhập</h4>
                    </div>

                    <!-- Hiển thị thông báo lỗi -->
                    <div th:if="${param.error}" class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Tên đăng nhập hoặc mật khẩu không đúng!
                    </div>

                    <!-- Hiển thị thông báo logout -->
                    <div th:if="${param.logout}" class="alert alert-success">
                        <i class="fas fa-check-circle me-2"></i>
                        Bạn đã đăng xuất thành công!
                    </div>

                    <!-- Hiển thị thông báo đăng ký thành công -->
                    <div th:if="${param.registerSuccess}" class="alert alert-success">
                        <i class="fas fa-check-circle me-2"></i>
                        Đăng ký thành công! Vui lòng đăng nhập.
                    </div>

                    <!-- Form đăng nhập với form binding -->
                    <form th:action="@{/perform_login}" th:object="${loginRequest}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                <i class="fas fa-user me-1"></i>Tên đăng nhập
                            </label>
                            <input type="text" class="form-control" id="username"
                                   th:field="*{username}" placeholder="Nhập tên đăng nhập" required>
                            <!-- Hiển thị lỗi validation -->
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                                 th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock me-1"></i>Mật khẩu
                            </label>
                            <input type="password" class="form-control" id="password"
                                   th:field="*{password}" placeholder="Nhập mật khẩu" required>
                            <!-- Hiển thị lỗi validation -->
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember-me"
                                   th:field="*{rememberMe}">
                            <label class="form-check-label" for="remember-me">
                                Ghi nhớ đăng nhập
                            </label>
                        </div>

                        <!-- CSRF Token -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <button type="submit" class="btn btn-pink mb-3">
                            <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="mb-2">
                            <a href="/register" class="text-decoration-none">
                                <i class="fas fa-user-plus me-1"></i>Tạo tài khoản mới
                            </a>
                        </p>
                        <p class="mb-0">
                            <a href="/forgot-password" class="text-decoration-none">
                                <i class="fas fa-key me-1"></i>Quên mật khẩu?
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
