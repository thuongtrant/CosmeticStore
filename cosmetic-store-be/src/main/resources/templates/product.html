<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{base :: layout(~{::title}, ~{::main})}">
<head>
    <title>Quản lý sản phẩm - BeautyForYou Admin</title>
</head>
<body>
<main>
    <div class="main-content">
        <div class="container-fluid mt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="page-title"><i class="fas fa-box me-2"></i>Quản lý sản phẩm</h2>
                <div>
                    <a th:href="@{/admin/products/add}" class="btn btn-pink me-2">
                        <i class="fas fa-plus me-1"></i>Thêm sản phẩm mới
                    </a>
                    <a th:href="@{/admin/dashboard}" class="btn btn-outline-pink">
                        <i class="fas fa-arrow-left me-1"></i>Quay lại Dashboard
                    </a>
                </div>
            </div>

            <div class="management-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0"><i class="fas fa-list me-2"></i>Danh sách sản phẩm</h5>
                </div>
                <div class="table-responsive" th:if="${products != null and not #lists.isEmpty(products)}">
                    <table class="table table-striped align-middle">
                        <thead>
                        <tr>
                            <th>Ảnh đại diện</th>
                            <th>Tên sản phẩm</th>
                            <th>Giá</th>
                            <th>Danh mục</th>
                            <th>Ảnh phụ</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="product : ${products}">
                            <td>
                                <img th:if="${product.mainImage}" th:src="${product.mainImage}"
                                     alt="main image" style="height:60px;width:auto;border-radius:10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                            </td>
                            <td>
                                <strong th:text="${product.name}"></strong>
                            </td>
                            <td>
                                <span class="fw-bold text-success" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                            </td>
                            <td>
                                <span class="badge bg-secondary" th:text="${product.categoryName}"></span>
                            </td>
                            <td>
                                <div style="display:flex;gap:4px;flex-wrap:wrap;">
                                    <img th:each="img : ${product.images}" th:src="${img}"
                                         alt="img" style="height:32px;width:auto;border-radius:6px; box-shadow: 0 1px 4px rgba(0,0,0,0.1);">
                                </div>
                            </td>
                            <td>
                                <div class="d-flex gap-2">
                                    <a th:href="@{/admin/products/{id}/edit(id=${product.id})}"
                                       class="btn btn-outline-pink btn-sm">
                                        <i class="fas fa-edit me-1"></i>Sửa
                                    </a>
                                    <a th:href="@{/admin/products/{id}/delete(id=${product.id})}"
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này?')">
                                        <i class="fas fa-trash me-1"></i>Xóa
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div th:if="${products == null or #lists.isEmpty(products)}" class="text-center py-5">
                    <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
                    <h5 class="text-muted">Chưa có sản phẩm nào</h5>
                    <p class="text-muted">Hãy thêm sản phẩm đầu tiên để bắt đầu quản lý sản phẩm</p>
                    <a th:href="@{/admin/products/add}" class="btn btn-pink">
                        <i class="fas fa-plus me-1"></i>Thêm sản phẩm đầu tiên
                    </a>
                </div>

                <!-- Phân trang -->
                <div th:if="${pagedProducts != null and pagedProducts.totalPages > 1}" class="d-flex justify-content-between align-items-center mt-4">

                    <nav aria-label="Product pagination">
                        <ul class="pagination pagination-sm mb-0">

                            <!-- Previous page -->
                            <li class="page-item" th:classappend="${!pagedProducts.hasPrevious} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/products(page=${pagedProducts.currentPage - 1}, size=${pagedProducts.size})}">
                                    <i class="fas fa-angle-left"></i>
                                </a>
                            </li>

                            <!-- Page numbers -->
                            <th:block th:each="pageNum : ${#numbers.sequence(
                                pagedProducts.currentPage - 2 < 0 ? 0 : pagedProducts.currentPage - 2,
                                pagedProducts.currentPage + 2 >= pagedProducts.totalPages ? pagedProducts.totalPages - 1 : pagedProducts.currentPage + 2
                            )}">
                                <li class="page-item" th:classappend="${pageNum == pagedProducts.currentPage} ? 'active'">
                                    <a class="page-link" th:href="@{/admin/products(page=${pageNum}, size=${pagedProducts.size})}"
                                       th:text="${pageNum + 1}"></a>
                                </li>
                            </th:block>

                            <!-- Next page -->
                            <li class="page-item" th:classappend="${!pagedProducts.hasNext} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/products(page=${pagedProducts.currentPage + 1}, size=${pagedProducts.size})}">
                                    <i class="fas fa-angle-right"></i>
                                </a>
                            </li>

                        </ul>
                    </nav>
                </div>

            </div>
        </div>
    </div>
</main>
</body>
</html>
