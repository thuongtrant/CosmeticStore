<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm - BFY Store</title>
    <th:block th:replace="base :: resources"></th:block>
    <th:block th:replace="base :: styles"></th:block>
</head>
<body>
<div th:replace="base :: header"></div>
<div class="container mt-5">
    <div class="row mb-4">
<!--        <div class="col">-->
<!--            <h2>Quản lý sản phẩm</h2>-->
<!--        </div>-->
        <div class="col text-end">
            <a th:href="@{/admin/products/add}" class="btn btn-primary"
               style="background-color: #d6ada9; color: white; border-color: #d6ada9; padding: 8px 12px; border-radius: 3px; text-decoration: none; margin: 10px">
                Thêm sản phẩm mới
            </a>
            <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Quay lại Dashboard</a>
        </div>
    </div>
    <div class="card">
        <div class="card-header">
            <h4>Danh sách sản phẩm</h4>
        </div>
        <div class="card-body">
            <div th:if="${products != null and not #lists.isEmpty(products)}">
                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>Ảnh đại diện</th>
                        <th>Tên sản phẩm</th>
                        <th>Giá</th>
                        <th>Danh mục</th>
                        <th>Ảnh phụ</th>
                        <th>Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product : ${products}">
                        <td>
                            <img th:if="${product.mainImage}" th:src="${product.mainImage}"
                                 alt="main image" style="height:60px;width:auto;border-radius:6px;">
                        </td>
                        <td th:text="${product.name}"></td>
                        <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                        <td th:text="${product.categoryName}"></td>
                        <td>
                            <div style="display:flex;gap:4px;flex-wrap:wrap;">
                                <img th:each="img : ${product.images}" th:src="${img}"
                                     alt="img" style="height:32px;width:auto;border-radius:3px;">
                            </div>
                        </td>

                        <td>
                            <a th:href="@{/admin/products/{id}/edit(id=${product.id})}" class="btn btn-warning btn-sm" style="background-color: #a6f1ff; border-color: #a6f1ff">Sửa</a>
                            <a th:href="@{/admin/products/{id}/delete(id=${product.id})}" class="btn btn-danger btn-sm"
                               onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này?')">Xóa</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
<!--            <div th:if="${products == null or #lists.isEmpty(products)}" class="text-center">-->
<!--                <p>Chưa có sản phẩm nào</p>-->
<!--                <p>Hãy thêm sản phẩm đầu tiên để bắt đầu quản lý sản phẩm</p>-->
<!--            </div>-->
        </div>
    </div>
</div>
</body>
</html>
