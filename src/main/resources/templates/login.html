<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - BeautyForYou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #E0B7B3;
            --dark-pink: #D4A4A0;
            --light-pink: #F5E6E4;
            --text-dark: #5D4E75;
            --white: #FFFFFF;
        }

        body {
            background: linear-gradient(135deg, var(--light-pink) 0%, var(--white) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-dark);
        }

        .login-container {
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(224, 183, 179, 0.2);
            overflow: hidden;
            border-left: 5px solid var(--primary-pink);
        }

        .login-form {
            padding: 3rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .brand-logo {
            color: var(--primary-pink);
            font-size: 2rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            display: block;
        }

        .btn-pink {
            background: linear-gradient(135deg, var(--primary-pink), var(--dark-pink));
            border: none;
            color: var(--white);
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-pink:hover {
            background: linear-gradient(135deg, var(--dark-pink), var(--primary-pink));
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(224, 183, 179, 0.3);
        }

        .form-control {
            border-radius: 12px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 0.2rem rgba(224, 183, 179, 0.25);
        }

        .form-label {
            color: var(--text-dark);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .alert {
            border-radius: 12px;
            border-left: 4px solid;
        }

        .alert-danger {
            background: #fff5f5;
            border-left-color: #dc3545;
            color: #721c24;
        }

        .alert-success {
            background: #f0fff4;
            border-left-color: #28a745;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="login-container">
                    <div class="login-form">
                        <div class="login-header">
                            <a href="/" class="brand-logo">
                                <i class="fas fa-spa"></i> BeautyForYou
                            </a>
                            <h4 class="text-center mb-0">Đăng nhập</h4>
                        </div>

                        <!-- Hiển thị thông báo lỗi -->
                        <div th:if="${param.error}" class="alert alert-danger">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            Tên đăng nhập hoặc mật khẩu không đúng!
                        </div>

                        <!-- Hiển thị thông báo logout -->
                        <div th:if="${param.logout}" class="alert alert-success">
                            <i class="fas fa-check-circle me-2"></i>
                            Bạn đã đăng xuất thành công!
                        </div>

                        <!-- Hiển thị thông báo đăng ký thành công -->
                        <div th:if="${param.registerSuccess}" class="alert alert-success">
                            <i class="fas fa-check-circle me-2"></i>
                            Đăng ký thành công! Vui lòng đăng nhập.
                        </div>

                        <!-- Form đăng nhập -->
                        <form th:action="@{/perform_login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="fas fa-user me-1"></i>Tên đăng nhập
                                </label>
                                <input type="text" class="form-control" id="username" name="username"
                                       placeholder="Nhập tên đăng nhập" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock me-1"></i>Mật khẩu
                                </label>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="Nhập mật khẩu" required>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                                <label class="form-check-label" for="remember-me">
                                    Ghi nhớ đăng nhập
                                </label>
                            </div>

                            <!-- CSRF Token -->
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <button type="submit" class="btn btn-pink mb-3">
                                <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
                            </button>
                        </form>

                        <div class="text-center mt-3">
                            <p class="mb-2">
                                <a href="/register" class="text-decoration-none">
                                    <i class="fas fa-user-plus me-1"></i>Tạo tài khoản mới
                                </a>
                            </p>
                            <p class="mb-0">
                                <a href="/forgot-password" class="text-decoration-none">
                                    <i class="fas fa-key me-1"></i>Quên mật khẩu?
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
