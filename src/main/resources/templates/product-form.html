<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form danh mục - BFY Store </title>
    <th:block th:replace="base :: resources"></th:block>
    <th:block th:replace="base :: styles"></th:block>
</head>
<body>
<div th:replace="base :: header"></div>

<div class="container mt-5">
    <h2 th:text="${productRequest.id} ? 'Sửa Sản Phẩm' : 'Thêm Sản Phẩm Mới'">Thêm Sản Phẩm Mới</h2>
    <form th:action="@{/admin/product/save}" th:object="${productRequest}" method="post" enctype="multipart/form-data">


        <!-- Tên sản phẩm -->
        <div class="mb-3">
            <label for="name" class="form-label">Tên sản phẩm</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" required>
        </div>

        <!-- Loại sản phẩm -->
        <div class="mb-3">
            <label for="type" class="form-label">Loại sản phẩm</label>
            <input type="text" class="form-control" id="type" th:field="*{type}" required>
        </div>

        <!-- Giá -->
        <div class="mb-3">
            <label for="price" class="form-label">Giá (VND)</label>
            <input type="number" step="0.01" class="form-control" id="price" th:field="*{price}" required>
        </div>

        <!-- Số lượng tồn kho -->
        <div class="mb-3">
            <label for="inventory" class="form-label">Số lượng tồn kho</label>
            <input type="number" class="form-control" id="inventory" th:field="*{inventory}" required>
        </div>

        <!-- Lợi ích -->
        <div class="mb-3">
            <label for="benefits" class="form-label">Lợi ích</label>
            <textarea class="form-control" id="benefits" th:field="*{benefits}" rows="4"></textarea>
        </div>

        <!-- Mô tả -->
        <div class="mb-3">
            <label for="description" class="form-label">Mô tả</label>
            <textarea class="form-control" id="description" th:field="*{description}" rows="4"></textarea>
        </div>

        <!-- Cách sử dụng -->
        <div class="mb-3">
            <label for="howToUse" class="form-label">Cách sử dụng</label>
            <textarea class="form-control" id="howToUse" th:field="*{howToUse}" rows="4"></textarea>
        </div>

        <!-- Danh mục -->
        <div class="mb-3">
            <label for="categoryId" class="form-label">Danh mục</label>
            <select class="form-select" id="categoryId" th:field="*{categoryId}" required>
                <option value="">Chọn danh mục</option>
                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
            </select>
        </div>

        <!-- Là sản phẩm bán chạy -->
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="isBestSeller" th:field="*{isBestSeller}">
            <label class="form-check-label" for="isBestSeller">Sản phẩm bán chạy</label>
        </div>

        <!-- Là sản phẩm mới -->
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="isNew" th:field="*{isNew}">
            <label class="form-check-label" for="isNew">Sản phẩm mới</label>
        </div>

        <!-- Hình ảnh -->
        <div class="mb-3">
            <label for="imageFile" class="form-label">Hình ảnh sản phẩm</label>
            <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*">
        </div>

        <!-- Nút gửi -->
        <button type="submit" class="btn btn-primary">Lưu</button>
        <a th:href="@{/admin/product}" class="btn btn-secondary">Hủy</a>
    </form>
</div>
</body>
</html>
