<div class="container mt-5">
    <div class="row mb-4">
        <div class="col">
            <h2>Quản lý sản phẩm</h2>
        </div>
        <div class="col text-end">
            <a th:href="@{/admin/product/new}" class="btn btn-primary"
               style="background-color: #d6ada9; color: white; border-color: #d6ada9; padding: 8px 12px; border-radius: 3px;
                text-decoration: none; margin: 10px">Thêm sản phẩm mới</a>
            <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Quay lại Dashboard</a>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h4>Danh sách sản phẩm</h4>
        </div>
        <div class="card-body">
            <div th:if="${products != null and not #lists.isEmpty(products)}">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>Tên</th>
                        <th>Loại</th>
                        <th>Giá</th>
                        <th>Kho</th>
                        <th>Danh mục</th>
                        <th>Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product : ${products}">
                        <td th:text="${product.name}"></td>
                        <td th:text="${product.type}"></td>
                        <td th:text="${product.price} + ' đ'"></td>
                        <td th:text="${product.inventory}"></td>
                        <td th:text="${product.category?.name}"></td>
                        <td>
                            <a th:href="@{/admin/product/edit/{id}(id=${product.id})}" class="btn btn-warning btn-sm" style="background-color: #a6f1ff; border-color: #a6f1ff">Sửa</a>
                            <a th:href="@{/admin/product/delete/{id}(id=${product.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này?')">Xóa</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${products == null or #lists.isEmpty(products)}" class="text-center">
                <p>Chưa có sản phẩm nào</p>
                <p>Hãy thêm sản phẩm đầu tiên để bắt đầu quản lý sản phẩm</p>
            </div>
        </div>
    </div>
</div>
