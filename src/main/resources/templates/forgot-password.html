<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - BeautyForYou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #E0B7B3;
            --dark-pink: #D4A4A0;
            --light-pink: #F5E6E4;
            --text-dark: #5D4E75;
            --white: #FFFFFF;
        }

        body {
            background: linear-gradient(135deg, var(--light-pink) 0%, var(--white) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-dark);
        }

        .forgot-password-container {
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(224, 183, 179, 0.2);
            overflow: hidden;
            border-left: 5px solid var(--primary-pink);
        }

        .forgot-password-form {
            padding: 3rem;
        }

        .form-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .brand-logo {
            color: var(--primary-pink);
            font-size: 2rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            display: block;
        }

        .btn-pink {
            background: linear-gradient(135deg, var(--primary-pink), var(--dark-pink));
            border: none;
            color: var(--white);
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-pink:hover {
            background: linear-gradient(135deg, var(--dark-pink), var(--primary-pink));
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(224, 183, 179, 0.3);
        }

        .btn-outline-pink {
            border: 2px solid var(--primary-pink);
            color: var(--primary-pink);
            background: transparent;
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-outline-pink:hover {
            background: var(--primary-pink);
            color: var(--white);
            transform: translateY(-1px);
        }

        .form-control {
            border-radius: 12px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 0.2rem rgba(224, 183, 179, 0.25);
        }

        .form-label {
            color: var(--text-dark);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .alert {
            border-radius: 12px;
            border-left: 4px solid;
        }

        .alert-danger {
            background: #fff5f5;
            border-left-color: #dc3545;
            color: #721c24;
        }

        .alert-success {
            background: #f0fff4;
            border-left-color: #28a745;
            color: #155724;
        }

        .text-center a {
            color: var(--primary-pink);
            text-decoration: none;
            font-weight: 500;
        }

        .text-center a:hover {
            color: var(--dark-pink);
        }

        .info-box {
            background: var(--light-pink);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border-left: 4px solid var(--primary-pink);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="forgot-password-container">
                    <div class="forgot-password-form">
                        <div class="form-header">
                            <a href="/" class="brand-logo">
                                <i class="fas fa-gem me-2"></i>BeautyForYou
                            </a>
                            <h3 style="color: var(--text-dark); margin-bottom: 0.5rem;">Quên mật khẩu</h3>
                            <p class="text-muted">Nhập email để nhận link đặt lại mật khẩu</p>
                        </div>

                        <!-- Info Box -->
                        <div class="info-box">
                            <div class="d-flex align-items-center">
                                <i class="fas fa-info-circle me-3" style="color: var(--primary-pink); font-size: 1.5rem;"></i>
                                <div>
                                    <h6 class="mb-1">Hướng dẫn đặt lại mật khẩu</h6>
                                    <small>Chúng tôi sẽ gửi link đặt lại mật khẩu đến email của bạn. Link có hiệu lực trong 24 giờ.</small>
                                </div>
                            </div>
                        </div>

                        <!-- Messages -->
                        <div th:if="${message}" th:class="${'alert alert-' + (messageType == 'success' ? 'success' : 'danger')}">
                            <i th:class="${'fas ' + (messageType == 'success' ? 'fa-check-circle' : 'fa-exclamation-circle') + ' me-2'}"></i>
                            <span th:text="${message}"></span>
                        </div>

                        <!-- Forgot Password Form -->
                        <form th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post">
                            <div class="mb-4">
                                <label for="email" class="form-label">
                                    <i class="fas fa-envelope me-1"></i>Email của bạn
                                </label>
                                <input type="email" class="form-control" th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                       placeholder="Nhập email đã đăng ký..." required>
                                <div th:if="${#fields.hasErrors('email')}" class="invalid-feedback">
                                    <span th:errors="*{email}"></span>
                                </div>
                                <small class="text-muted">
                                    <i class="fas fa-shield-alt me-1"></i>
                                    Email sẽ được bảo mật và không chia sẻ với bên thứ ba
                                </small>
                            </div>

                            <div class="d-grid mb-4">
                                <button type="submit" class="btn btn-pink">
                                    <i class="fas fa-paper-plane me-2"></i>Gửi link đặt lại mật khẩu
                                </button>
                            </div>
                        </form>

                        <!-- Footer Links -->
                        <div class="text-center">
                            <p class="mb-3">
                                Nhớ mật khẩu rồi?
                                <a href="/login">
                                    <i class="fas fa-sign-in-alt me-1"></i>Đăng nhập ngay
                                </a>
                            </p>
                            <div class="d-flex gap-2 justify-content-center">
                                <a href="/register" class="btn-outline-pink btn btn-sm">
                                    <i class="fas fa-user-plus me-1"></i>Đăng ký
                                </a>
                                <a href="/" class="btn-outline-pink btn btn-sm">
                                    <i class="fas fa-home me-1"></i>Trang chủ
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
